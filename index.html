<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>

    <!-- SEO -->
    <title>Void Runner — Synthwave On-Rails Shooter</title>
    <meta
      name="description"
      content="Pilot your ship through the void in this vaporwave on-rails shooter. Dodge, shoot, upgrade, and face the Void Carrier boss."
    />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Void Runner" />
    <meta
      property="og:description"
      content="Synthwave on-rails shooter — dodge, shoot, upgrade, face the Void Carrier."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Void Runner" />
    <meta
      name="twitter:description"
      content="Synthwave on-rails shooter — dodge, shoot, upgrade, face the Void Carrier."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cursor Vibe Jam 2026 widget (required for submission) -->
    <script async src="https://vibej.am/2026/widget.js"></script>
  </body>
</html>
